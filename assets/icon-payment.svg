<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paymentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Credit Card -->
  <rect x="8" y="20" width="48" height="28" rx="4" fill="url(#paymentGrad)" opacity="0.15"/>
  <rect x="8" y="20" width="48" height="28" rx="4" fill="none" stroke="url(#paymentGrad)" stroke-width="2.5"/>
  
  <!-- Magnetic Strip -->
  <rect x="8" y="28" width="48" height="6" fill="url(#paymentGrad)"/>
  
  <!-- Chip -->
  <rect x="14" y="38" width="8" height="6" rx="1" fill="url(#paymentGrad)"/>
  <line x1="16" y1="38" x2="16" y2="44" stroke="#fff" stroke-width="0.5"/>
  <line x1="18" y1="38" x2="18" y2="44" stroke="#fff" stroke-width="0.5"/>
  <line x1="20" y1="38" x2="20" y2="44" stroke="#fff" stroke-width="0.5"/>
  
  <!-- Card Numbers -->
  <circle cx="28" cy="41" r="1.5" fill="url(#paymentGrad)"/>
  <circle cx="32" cy="41" r="1.5" fill="url(#paymentGrad)"/>
  <circle cx="36" cy="41" r="1.5" fill="url(#paymentGrad)"/>
  <circle cx="40" cy="41" r="1.5" fill="url(#paymentGrad)"/>
</svg>
